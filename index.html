      if(e.data&&e.data.length&&e.data[0].updated_at===o.base)return{conflict:true,message:'You are not allowed to edit this entry.'};   // unchanged but not updatable = RLS, not a conflict
      return{conflict:true,message:'This entry was changed or deleted on another device. Your edit was not applied.'}}
    return{updated_at:x.data[0].updated_at}}
  const row={client_id:o.client_id,household_id:o.household_id,user_id:o.uid,wallet_id:o.wallet_id,to_wallet_id:o.to_wallet_id,type:o.type,amount:o.amount,category:o.category,note:o.note,created_at:o.created_at};
  const x=await sb.from('transactions').upsert(row,{onConflict:'client_id',ignoreDuplicates:true});return{error:x.error,status:x.status}}
/* every failure is reported against the operation that actually failed (never a generic "Could not save") */
const FAILS={expense:'Expense sync failed',income:'Income sync failed',transfer:'Transfer sync failed',withdraw:'Withdrawal sync failed',deposit:'Deposit sync failed',upd:'Edit sync failed',del:'Delete sync failed',qi:'Quick purchase sync failed'};
const opWhat=d=>d.name?` (${T(d.name)}${d.amount?' · '+fmt(d.amount):''})`:'';
const failText=d=>T(FAILS[d.kind]||'Sync failed')+opWhat(d)+': '+T(d.message||'');
let busy=false,again=false;
async function flush(){
  if(busy){again=true;return}if(!Qo||!navigator.onLine){netPaint();return}busy=true;let r={};const q0=Qo,u0=me;
  try{r=await Core.sync(q0,u0,{online:()=>navigator.onLine,sessionUid:async()=>{const r=await timeout(sb.auth.getSession(),10000);if(!r)throw new Error('timeout');const{data,error}=r;   // a stuck lookup must never block the queue for good
      if(data&&data.session)return data.session.user.id;
      if(error&&storedUid())throw error;                          // could not be checked (network): not "signed out"
      return null},exec});
    if(u0===me)authLost=r.stopped==='auth'}
  finally{busy=false}
  if(u0!==me||!hh)return;                                          // logged out / switched account while syncing
  const did=!!(r.synced||r.failed||r.conflict);if(did)await load();else netPaint();
  const msgs=[...(r.errors||[]),...(r.conflicts||[])].map(failText);
  if(msgs.length)notify(msgs[0]+(msgs.length>1?` (+${msgs.length-1} ${T('more — see Needs attention')})`:''),true);
  if(again){again=false;return flush()}
  return did;
}
const KIND={del:'Delete',upd:'Edit',qi:'Quick purchase'};

  v.innerHTML='<h2>Needs attention</h2>'+(L.map(o=>{const d=Core.describe(o);return `<div class="tx"><div><b>${esc(KIND[d.kind]||TL[d.kind]||d.kind)}${d.name?' · '+esc(d.name):''} ${d.amount?fmt(d.amount):''}</b><br><small>${esc(T(FAILS[d.kind]||'Sync failed'))}: ${esc(o.err)}</small></div><div>${o.state==='failed'?`<button class="link" data-retry="${o.qid}">Retry</button> · `:''}<button class="link" data-discard="${o.qid}">Discard</button></div></div>`}).join('')||'<p style="color:var(--mut)">All synced.</p>');
  v.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{Qo.mark(b.dataset.retry,'pending','');flush().then(()=>cur==='sync'&&syncView())});

let dd=day(new Date());
async function dailyView(){
  const v=$('#more');if(!navigator.onLine)return v.innerHTML=need();
  const a=Core.cairoStart(dd),b=Core.cairoStart(Core.addDays(dd,1));
  const [r,l]=await Promise.all([sb.rpc('range_stats',{h:hh.id,d1:dd,d2:dd}),sb.from('transactions').select('*,profiles(name)').eq('household_id',hh.id).eq('type','expense').gte('created_at',a).lt('created_at',b).order('created_at',{ascending:false})]);
  if(cur!=='daily')return;                                        // the user moved to another tab while this was loading

const F={q:'',a:'',b:'',c:'',m:'',s:'created_at.desc'};
async function histView(){
  const v=$('#more');if(!navigator.onLine)return v.innerHTML=need();
  const {data:mem}=await sb.from('members').select('user_id,profiles(name)').eq('household_id',hh.id);if(cur!=='hist')return;
  const S=[['created_at.desc','Newest first'],['created_at.asc','Oldest first'],['amount.desc','Highest amount'],['amount.asc','Lowest amount']];
  v.innerHTML=`<input id="fq" placeholder="Search" value="${esc(F.q)}"><div class="row"><input id="fa" type="date" value="${F.a}"><input id="fb" type="date" value="${F.b}"></div>
  <select id="fc"><option value="">All categories</option>${items.map(i=>`<option value="${esc(i.name)}" ${F.c===i.name?'selected':''}>${esc(i.name)}</option>`).join('')}</select>
  <select id="fm"><option value="">Everyone</option>${(mem||[]).map(m=>`<option value="${m.user_id}" ${F.m===m.user_id?'selected':''}>${esc(m.profiles?.name)}</option>`).join('')}<option value="~deleted" ${F.m==='~deleted'?'selected':''}>${T('Deleted user')}</option></select>
  <select id="fs">${S.map(o=>`<option value="${o[0]}" ${F.s===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><div id="hl" style="margin-top:10px"></div>`;
  const PAGE=50;let hrows=[];
  const run=async(reset=true)=>{
    let q=sb.from('transactions').select('*,profiles(name)').eq('household_id',hh.id);
    const t=F.q.replace(/[,()%*]/g,'');if(t)q=q.or(`category.ilike.%${t}%,note.ilike.%${t}%`);
    if(F.a)q=q.gte('created_at',Core.cairoStart(F.a));if(F.b)q=q.lt('created_at',Core.cairoStart(Core.addDays(F.b,1)));
    if(F.c)q=q.eq('category',F.c);if(F.m==='~deleted')q=q.is('user_id',null);else if(F.m)q=q.eq('user_id',F.m);
    const [col,dir]=F.s.split('.'),from=reset?0:hrows.length;
    const {data,error}=await q.order(col,{ascending:dir==='asc'}).order('id').range(from,from+PAGE-1);
    if(cur!=='hist'||!$('#hl'))return;
    if(error)return $('#hl').innerHTML=`<p class="err">${esc(error.message)}</p>`;
    hrows=reset?data:[...hrows,...data];
    $('#hl').innerHTML=(hrows.map(t=>trow(t,1)).join('')||'<p style="color:var(--mut)">No matching transactions.</p>')+(data.length===PAGE?'<button class="btn alt" id="lm">Load more</button>':'');
    $('#hl').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>askDelete(hrows.find(y=>y.id===b.dataset.d)));
    $('#hl').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const x=hrows.find(y=>y.id===b.dataset.e);x&&openSheet(x.type,'','',x)});
    window.histRefresh=run;if($('#lm'))$('#lm').onclick=()=>run(false);
  };
  [['fq','q'],['fa','a'],['fb','b'],['fc','c'],['fm','m'],['fs','s']].forEach(([id,k])=>$('#'+id).oninput=e=>{F[k]=e.target.value;run(true)});
  run();
}
