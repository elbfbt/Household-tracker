<title>Household Tracker</title>
<style>
:root{--ink:#12302e;--bg:#f1f5f4;--card:#fff;--tx:#14201f;--mut:#667472;--acc:#f2a93b;--bad:#c8412b;--ok:#1f8a63;--ln:#dde5e3}
@media(prefers-color-scheme:dark){:root{--bg:#0c1615;--card:#14231f;--tx:#e8f0ee;--mut:#8da39f;--ln:#243532}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:520px;margin:0 auto;padding:12px 14px 40px}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:18px 18px 16px;margin-top:6px}
.hero small{opacity:.7}.bal{font-size:40px;font-weight:700;letter-spacing:-.02em}.row{display:flex;gap:10px}.row>div{flex:1}.row b{display:block;font-size:17px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);padding:6px 4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-inline-end:6px}.off .dot{background:var(--bad)}.sync .dot{background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
button{font:inherit;color:inherit;border:0;cursor:pointer}.tile{background:var(--card);border:1px solid var(--ln);border-radius:18px;min-height:76px;padding:12px;text-align:start;font-weight:600}
.tile span{display:block;font-weight:400;color:var(--mut);font-size:14px}.tile.big{background:var(--acc);color:#2a1d00;border:0}.tile.inc{border-color:var(--ok)}
h2{font-size:15px;margin:20px 4px 8px;color:var(--mut);font-weight:600}
.tx{display:flex;justify-content:space-between;gap:8px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:6px;border:1px solid var(--ln)}
.tx small{color:var(--mut)}.amt{font-weight:700;white-space:nowrap}.neg{color:var(--bad)}.pos{color:var(--ok)}.x{background:none;color:var(--mut);font-size:20px;padding:0 4px}
input{width:100%;font:inherit;padding:14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);margin:6px 0}
.btn{width:100%;padding:15px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;margin-top:8px}.btn.alt{background:none;color:var(--mut);font-weight:500}
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;background:#0007;display:none;align-items:flex-end;z-index:9}.sheet.on{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
#amt{font-size:34px;font-weight:700;text-align:center}.link{background:none;color:var(--mut);text-decoration:underline;font-size:13px}.auth{padding-top:8vh}.auth h1{font-size:30px;margin:0 0 4px}.err{color:var(--bad);min-height:20px}

#nv{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nv button{flex:1;padding:14px 0;background:none;color:var(--mut);font-weight:600}#nv button.on{color:var(--tx);box-shadow:inset 0 3px var(--acc)}main{padding-bottom:90px}
select{width:100%;font:inherit;padding:14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);margin:6px 0}
.chips{display:flex;gap:8px;margin:6px 0}.chips button{flex:1;padding:11px 0;border-radius:12px;background:var(--card);border:1px solid var(--ln)}.chips button.on{background:var(--ink);color:#fff}
.bi{margin:10px 0}.bl{display:flex;justify-content:space-between;font-size:14px}.bt{height:9px;border-radius:5px;background:var(--ln);margin-top:4px}.bt i{display:block;height:100%;border-radius:5px;background:var(--acc)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp div{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}.kp small{color:var(--mut)}.kp b{display:block;font-size:20px}
.dc{display:flex;align-items:flex-end;gap:3px;height:90px;margin:10px 0}.dc i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}.dn{display:flex;justify-content:space-between;align-items:center}.dn button{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 16px}

:root{color-scheme:light dark}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}[hidden]{display:none!important}
button{-webkit-appearance:none;appearance:none}input[type=date]{min-width:0;min-height:50px;-webkit-appearance:none;appearance:none}
.bal{font-size:clamp(30px,9vw,44px)}.auth{max-width:440px;margin:0 auto}#more{max-width:760px;margin:0 auto}
#nv{max-width:760px;margin:0 auto}.sheet>div{max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch}
@media(min-width:600px){main{max-width:760px;padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(3,1fr)}.sheet{align-items:center}.sheet>div{border-radius:24px;max-width:460px}}
@media(min-width:900px){main{max-width:1100px;padding-bottom:40px}.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:start}
.cols>div+div{position:sticky;top:64px;max-height:calc(100vh - 90px);overflow:auto}
#nv{position:sticky;top:0;bottom:auto;max-width:none;border-top:0;border-bottom:1px solid var(--ln);border-radius:0 0 16px 16px;margin-bottom:6px}#nv button.on{box-shadow:inset 0 -3px var(--acc)}#more{max-width:900px}}
@media(hover:hover){.tile:hover,.btn:hover{filter:brightness(1.06)}}
.syb{background:#c8412b22;border:1px solid var(--bad);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;flex-direction:column;gap:4px}
</style></head><body><main id="app"><p style="padding:48px 20px;color:#889;font:17px system-ui">Loading…</p></main>
<div class="sheet" id="sh"><div><b id="st"></b><input id="amt" inputmode="decimal" placeholder="0"><input id="cat" placeholder="Category" hidden><select id="wl"></select><select id="wl2"></select><input id="nt" placeholder="Note (optional)"><button class="btn" id="sv">Save</button><button class="btn alt" onclick="sh.classList.remove('on')">Cancel</button></div></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script type="text/plain" id="appjs">
const LS=(()=>{const m={};let real=null;try{localStorage.setItem('_t','1');localStorage.removeItem('_t');real=localStorage}catch(e){}
return{failed:false,getItem:k=>{try{const v=real&&real.getItem(k);return v!=null?v:(k in m?m[k]:null)}catch(e){return k in m?m[k]:null}},
setItem:function(k,v){v=String(v);try{if(!real)throw 0;real.setItem(k,v);delete m[k]}catch(e){m[k]=v;this.failed=true}},removeItem:k=>{delete m[k];try{real&&real.removeItem(k)}catch(e){}}}})();
const LG=LS.getItem('ht_lang')||'en';const $=s=>document.querySelector(s),app=$('#app'),sh=$('#sh');
const sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'ht-auth'}});
const fmt=n=>new Intl.NumberFormat(LG==='ar'?'ar-EG':'en-EG',{style:'currency',currency:'EGP',maximumFractionDigits:2}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let wallets=[],hh=null,items=[],txs=[],sum={},edit=false,ch=null,status='';
let me=null,Qo=null,authLost=false,loggingOut=false;const Q=()=>Qo?Qo.all():[];

sb.auth.onAuthStateChange(e=>{ if(e==='PASSWORD_RECOVERY'){const p=prompt('New password (min 6 characters)');if(p)sb.auth.updateUser({password:p}).then(({error})=>alert(error?error.message:'Password updated'))}
  if(e==='SIGNED_OUT'&&me&&!loggingOut){me=null;Qo=null;authView('Your session expired. Log in again. Your unsynced entries are kept on this device.')} });
function adoptLegacy(){const raw=LS.getItem('ht_q');if(!raw)return;let old=[];try{old=JSON.parse(raw)}catch(e){}
  const ins=old.filter(o=>!o.op&&o.household_id&&o.client_id),ops=old.filter(o=>o.op);
  if(!ins.length){if(ops.length)LS.setItem('ht_legacy_ops',JSON.stringify(ops));LS.removeItem('ht_q');return}
  if(confirm(`${ins.length} entries from an older version are waiting on this device. Were they entered by YOU? OK = sync them to this account. Cancel = keep them isolated.`)){
    ins.forEach(o=>Qo.push(o));if(ops.length)LS.setItem('ht_legacy_ops',JSON.stringify(ops));LS.removeItem('ht_q')}}
async function boot(){
  loggingOut=false;
  const t0=await Promise.race([sb.auth.getSession(),new Promise(r=>setTimeout(()=>r(null),8000))]);
  const session=t0&&t0.data&&t0.data.session,cached=JSON.parse(LS.getItem('ht_hh')||'null');
  if(!session){if(!t0&&cached&&LS.getItem('ht_c')){hh=cached;return dashView()}return authView()}
  me=session.user.id;Qo=Core.Queue(LS,me);LS.setItem('ht_last_uid',me);adoptLegacy();
  let r;try{r=await sb.from('members').select('households(id,name,invite_code)').limit(1)}catch(e){r={error:e}}
  if(r.data&&r.data[0]){hh=r.data[0].households;LS.setItem('ht_hh',JSON.stringify(hh))}
  else if(r.error&&cached)hh=cached;
  else if(r.error)return retryView(r.error.message);
  hh?dashView():setupView();
}
function retryView(m){app.innerHTML=`<div class="auth"><h1>Can't reach the server</h1><p style="color:var(--mut)">${esc(m)}</p><button class="btn" onclick="boot()">Try again</button></div>`}
function authView(msg='',mode='in'){
  const up=mode==='up';
  app.innerHTML=`<div class="auth"><button class="link" onclick="setLang()">العربية / EN</button><h1>${up?'Create account':'Household Tracker'}</h1><p style="color:var(--mut)">${up?'Use your own email. Each family member needs their own account.':'Every purchase, one tap.'}</p>
  ${up?'<input id="nm" placeholder="Your name">':''}<input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${up?'new-password':'current-password'}">
  <div class="err" id="er">${esc(msg)}</div><button class="btn alt" id="rs" hidden></button><button class="btn" id="go">${up?'Create account':'Log in'}</button><button class="btn alt" id="sw">${up?'I already have an account':'New here? Create account'}</button>${up?'':'<button class="link" id="fp">Forgot password?</button>'}</div>`;
  try{localStorage.setItem('ht_t','1');localStorage.removeItem('ht_t')}catch(e){$('#er').textContent='Private mode detected: you will be logged out every time. Open the site in a normal tab.'}
  const v=()=>({email:$('#em').value.trim(),password:$('#pw').value}),fail=e=>$('#er').textContent=e.message;
  $('#sw').onclick=()=>authView('',up?'in':'up');
  const rs=$('#rs');let tm;
  const tick=()=>{clearInterval(tm);const f=()=>{const l=Math.ceil(((+LS.getItem('ht_rs')||0)-Date.now())/1000);rs.disabled=l>0;rs.textContent=l>0?`Resend in ${l}s`:'Resend confirmation email';if(l<=0)clearInterval(tm)};f();tm=setInterval(f,1000)};
  rs.onclick=async()=>{const email=$('#em').value.trim();if(!email)return fail({message:'Enter your email first.'});LS.setItem('ht_rs',Date.now()+60000);tick();
    const{error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+location.pathname}});$('#er').textContent=error?error.message:'Confirmation email sent.'};
  $('#go').onclick=async()=>{LS.removeItem('ht_hh');LS.removeItem('ht_c');
    if(up){const{data,error}=await sb.auth.signUp({...v(),options:{data:{name:$('#nm').value.trim()},emailRedirectTo:location.origin+location.pathname}});
      if(error)fail(error);else if(data.session)boot();else{$('#er').textContent='Check your email to confirm, then log in.';rs.hidden=false;tick()}}
    else{const{error}=await sb.auth.signInWithPassword(v());if(!error)return boot();fail(error);if(/confirm/i.test(error.message)){rs.hidden=false;tick()}}};
  if(!up)$('#fp').onclick=async()=>{const{error}=await sb.auth.resetPasswordForEmail($('#em').value.trim(),{redirectTo:location.origin+location.pathname});$('#er').textContent=error?error.message:'Reset link sent to your email.'};
}
function setupView(){
  app.innerHTML=`<div class="auth"><h1>Your household</h1><p style="color:var(--mut)">Start a new one, or join with a code.</p>
  <input id="hn" placeholder="Household name"><button class="btn" id="cr">Create household</button>
  <input id="cd" placeholder="Invitation code" style="margin-top:22px"><button class="btn" id="jn">Join household</button><div class="err" id="er"></div><button class="link" onclick="sb.auth.signOut().then(()=>{LS.removeItem('ht_hh');LS.removeItem('ht_c');boot()})">Log out</button></div>`;
  const go=async(fn,a)=>{const{error}=await sb.rpc(fn,a);error?$('#er').textContent=error.message:boot()};
  $('#cr').onclick=()=>go('create_household',{hname:$('#hn').value.trim()||'Home'});
  $('#jn').onclick=()=>go('join_household',{code:$('#cd').value});
}
async function dashView(){
  app.innerHTML=`<nav id="nv"><button data-n="home" class="on">Home</button><button data-n="daily">Daily</button><button data-n="stats">Stats</button><button data-n="hist">History</button></nav><div id="home"><div class="bar"><span id="net"><i class="dot"></i><span id="ns"></span></span><span><button class="link" id="inv">Invite code: ${esc(hh.invite_code)}</button> · <button class="link" id="lo">Log out</button> · <button class="link" onclick="setLang()">العربية / EN</button></span></div>
  <div id="syb" class="syb" hidden></div><div class="cols"><div><div class="hero"><small>Total balance</small><div class="bal" id="bal">…</div><div class="row"><div><small>Today</small><b id="s1"></b></div><div><small>This week</small><b id="s2"></b></div><div><small>This month</small><b id="s3"></b></div></div></div>
  <div class="kp" id="wb" style="margin-top:12px"></div><div class="grid"><button class="tile big" data-t="withdraw">Withdraw cash<span>Bank → household cash</span></button><button class="tile inc" data-t="income">Add income</button></div>
  <h2>Quick purchases ${''}<button class="link" id="ed"></button></h2><div class="grid" id="qi"></div>
  <div class="grid"><button class="tile" data-t="expense">Custom expense</button><button class="tile" data-t="deposit">Cash back to bank</button><button class="tile" data-t="transfer">Transfer</button></div>
  </div><div><h2>Recent</h2><div id="tl"></div></div></div></div><div id="more" hidden></div>`;
  $('#lo').onclick=()=>{const n=Q().filter(o=>o.state==='pending').length;if(n&&!confirm(T('You have unsynced entries. They stay on this device and sync the next time this account logs in. Log out anyway?')))return;loggingOut=true;sb.auth.signOut().then(()=>{hh=null;me=null;Qo=null;LS.removeItem('ht_hh');LS.removeItem('ht_c');boot()})};
  $('#inv').onclick=()=>{const t=`Join our household in Household Tracker with code: ${hh.invite_code}\n${location.origin+location.pathname}`;navigator.share?navigator.share({text:t}):prompt('Send this to your family:',t)};
  $('#ed').onclick=()=>{edit=!edit;paint()};document.querySelectorAll('#nv button').forEach(b=>b.onclick=()=>tab(b.dataset.n));
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openSheet(b.dataset.t));
  if(ch)sb.removeChannel(ch);
  const F0={schema:'public',table:'transactions'},fl=`household_id=eq.${hh.id}`;
  ch=sb.channel('tx-'+hh.id).on('postgres_changes',{...F0,event:'INSERT',filter:fl},loadSoon).on('postgres_changes',{...F0,event:'UPDATE',filter:fl},loadSoon).on('postgres_changes',{...F0,event:'DELETE'},loadSoon).subscribe(st=>{if(st==='SUBSCRIBED')loadSoon()});
  {const c=JSON.parse(LS.getItem('ht_c')||'null');if(c){({sum,items,txs,wallets}=c);paint()}}await load();flush();
}
let warned=false;const warnStore=()=>{if(LS.failed&&!warned){warned=true;alert(T('Your browser could not save data on this device. Entries may be lost if you close the app. Free some space or leave private mode.'))}};
let lt;const loadSoon=()=>{clearTimeout(lt);lt=setTimeout(load,250)};
function netPaint(){const n=$('#net');if(!n)return;const all=Q(),q=all.filter(o=>o.state==='pending').length,bad=all.filter(o=>o.state==='failed'||o.state==='conflict').length;
  const s=!navigator.onLine?'off':q?'sync':'';n.className=s;$('#ns').textContent=s==='off'?`Offline${q?` · ${q} waiting`:''}`:q?`Syncing ${q}…`:'Online';
  const f=Core.foreign(LS,me),b=$('#syb');let h='';
  if(authLost)h+=`<button class="link" data-act="relogin">Session expired. Log in again to sync ${q} entries.</button>`;
  if(bad)h+=`<button class="link" data-act="sync">${bad} entries need attention</button>`;
  if(f.length)h+=`<small>${f.reduce((a,x)=>a+x.count,0)} entries from another account are waiting on this device. Log in as that account to sync them.</small>`;
  b.innerHTML=h;b.hidden=!h;b.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>x.dataset.act==='sync'?tab('sync'):(authLost=false,authView('Log in to continue syncing.')))}
async function load(){
  if(navigator.onLine){
    const [a,b,c,d]=await Promise.all([sb.rpc('household_summary',{h:hh.id}),sb.from('quick_items').select('*').eq('household_id',hh.id).order('name'),
      sb.from('transactions').select('*,profiles(name)').eq('household_id',hh.id).order('created_at',{ascending:false}).order('id').limit(40),sb.rpc('wallet_balances',{h:hh.id})]);
    if(a.data&&d.data){sum=a.data;items=b.data||[];txs=c.data||[];wallets=d.data;LS.setItem('ht_c',JSON.stringify({sum,items,txs,wallets}))}
  }else{const c=JSON.parse(LS.getItem('ht_c')||'null');if(c)({sum,items,txs,wallets}=c)}
  paint();
}
function paint(){
  if(!$('#bal'))return;
  const q=Q(),P=Core.balances(wallets,q,(wallets[0]||{}).id),SP=Core.spendDeltas(q,Date.now());
  $('#bal').textContent=fmt(wallets.length?P.total:(sum.balance||0));
  $('#s1').textContent=fmt((sum.today||0)+SP.today);$('#s2').textContent=fmt((sum.week||0)+SP.week);$('#s3').textContent=fmt((sum.month||0)+SP.month);
  $('#ed').textContent=edit?'Done':'Edit prices';$('#wb').innerHTML=wallets.map(w=>`<div><small>${esc(w.name)}</small><b>${fmt(P.wallets[w.id])}</b></div>`).join('');
  $('#qi').innerHTML=items.map(i=>`<button class="tile" data-i="${i.id}">${esc(i.name)}<span>${fmt(i.default_price)}</span></button>`).join('');
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=items.find(x=>x.id===b.dataset.i);
    if(edit){const p=prompt(`Default price for ${it.name}`,it.default_price);if(p!==null&&p!==''&&num(p)>=0)sb.from('quick_items').update({default_price:Math.round(num(p)*100)/100}).eq('id',it.id).then(load)}
    else openSheet('expense',it.name,it.default_price)});
  const mine=q.filter(r=>!r.op&&r.state!=='conflict'&&r.household_id===hh.id).map(r=>({...r,id:r.client_id,pending:1,profiles:{name:'You'}}));
  $('#tl').innerHTML=[...mine,...txs].map(t=>trow(t,1)).join('')||'<p style="color:var(--mut)">No transactions yet. Withdraw cash to start.</p>';
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const x=txs.find(y=>y.id===b.dataset.d);x&&confirm(T('Delete this transaction?'))&&queueOp({op:'del',id:x.id,old:x})});
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const x=txs.find(y=>y.id===b.dataset.e);x&&openSheet(x.type,'','',x)});
  netPaint();
}
const LBL={transfer:'Transfer',withdraw:'Withdraw cash',income:'Add income',expense:'Expense',deposit:'Cash back to bank'};
function openSheet(type,cat='',price='',tx=null){
  const mv=MV.includes(type);
  $('#st').textContent=tx?T('Edit')+' · '+(tx.category||tx.type):(cat||LBL[type]);
  $('#amt').value=tx?tx.amount:price;$('#nt').value=tx?(tx.note||''):'';$('#cat').hidden=!tx;$('#cat').value=tx?(tx.category||''):'';sh.classList.add('on');
  $('#wl').innerHTML=wallets.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('');$('#wl2').innerHTML=wallets.map(w=>`<option value="${w.id}">→ ${esc(w.name)}</option>`).join('');
  $('#wl').hidden=!wallets.length;$('#wl2').hidden=!mv;
  if(tx){$('#wl').value=tx.wallet_id||'';if(mv)$('#wl2').value=tx.to_wallet_id||''}
  else if(mv){const bk=(wallets.find(w=>w.name==='Bank account')||wallets[1]||{}).id,cs=(wallets[0]||{}).id,pc=(wallets[2]||wallets[1]||{}).id;
    const [a,b]=type==='withdraw'?[bk,cs]:type==='deposit'?[cs,bk]:[cs,pc];if(a)$('#wl').value=a;if(b)$('#wl2').value=b}
  $('#nt').placeholder=type==='expense'&&!cat&&!tx?'What was it?':'Note (optional)';
  setTimeout(()=>{$('#amt').focus();$('#amt').select()},60);
  $('#sv').onclick=()=>{const a=Math.round(num($('#amt').value)*100)/100;if(!(a>0&&a<1e9))return $('#amt').focus();
    const note=$('#nt').value.trim(),w1=$('#wl').value||null,w2=mv?$('#wl2').value:null;
    if(w2&&w1===w2)return alert(T('Choose two different wallets'));

function queueOp(o){o.household_id=hh.id;Qo.push(o);

async function exec(o){
  if(o.op==='del'){const x=await sb.from('transactions').delete().eq('id',o.id).select('id');if(x.error)return{error:x.error,status:x.status};
    if(!x.data.length){const e=await sb.from('transactions').select('id').eq('id',o.id);if(e.data&&e.data.length)return{conflict:true,message:'You are not allowed to delete this entry.'}}
    return{}}
  if(o.op==='upd'){const x=await sb.from('transactions').update(o.patch).eq('id',o.id).eq('updated_at',o.base).select('id,updated_at');
    if(x.error)return{error:x.error,status:x.status};
    if(!x.data.length)return{conflict:true,message:'This entry was changed or deleted on another device.'};
    return{updated_at:x.data[0].updated_at}}
  const row={client_id:o.client_id,household_id:o.household_id,user_id:o.uid,wallet_id:o.wallet_id,to_wallet_id:o.to_wallet_id,type:o.type,amount:o.amount,category:o.category,note:o.note,created_at:o.created_at};
  const x=await sb.from('transactions').upsert(row,{onConflict:'client_id',ignoreDuplicates:true});return{error:x.error,status:x.status}}

}
